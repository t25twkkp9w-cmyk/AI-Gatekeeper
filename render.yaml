services:
  - type: web
    name: ai-gatekeeper
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: GATEKEEPER_MODE
        value: live
      - key: GATEKEEPER_DATA_DIR
        value: /tmp/gatekeeper-data
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: ai-gatekeeper-hosted
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: DEMO_USERNAME
        value: cohort
      - key: DEMO_PASSWORD
        sync: false
